name: Fork image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image after all checks pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' && 'cookout-publish' || format('fork-image-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Read the version
        id: version
        run: |
          version="$(jq -r .version package.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected version $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Smoke-test the image on a read-only root
        run: |
          docker build --tag cookout:check .
          trap 'docker logs cookout' EXIT
          docker run -d --name cookout --read-only --tmpfs /tmp -v cookout-data:/data -p 127.0.0.1:8080:8080 \
            -e COOKOUT_PUBLIC_URL=http://127.0.0.1:8080 -e COOKOUT_ADMIN_TOKEN="cookout_$(openssl rand -hex 32)" \
            cookout:check
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8080/v1/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/v1/health | grep -F '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/whoami)" = 401

  gate:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' && github.repository == 'mfroembgen/cookout'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      packages: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    outputs:
      release_sha: ${{ steps.source.outputs.release_sha }}
      publish: ${{ steps.image.outputs.publish }}
      index: ${{ steps.image.outputs.index }}
    steps:
      - name: Publish only from main, compared case-sensitively
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require upstream's checks on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          runs="$(gh run list --workflow check.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)"
          test "$runs" -gt 0 || { echo "check.yml has not passed on $GITHUB_SHA; dispatch it on main first" >&2; exit 1; }
      - name: Require the tag on upstream's first commit releasing this version
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="@ai-hero/cookout@$VERSION"
          git fetch --no-tags https://github.com/mattpocock/cookout.git main
          release_sha=""
          for commit in $(git rev-list --reverse FETCH_HEAD -- package.json); do
            if [ "$(git show "$commit:package.json" | jq -r .version)" = "$VERSION" ]; then release_sha="$commit"; break; fi
          done
          test -n "$release_sha" || { echo "no commit on upstream main releases $VERSION" >&2; exit 1; }
          test "$(git rev-parse "$tag^{commit}")" = "$release_sha" || { echo "$tag is not upstream's release commit $release_sha" >&2; exit 1; }
          git merge-base --is-ancestor "$release_sha" "$GITHUB_SHA"
          test "$release_sha" != "$GITHUB_SHA"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > /tmp/release-tags
          if grep -Fxq "$tag" /tmp/release-tags; then
            echo "Release $tag already exists; inspect its provenance before retrying" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build a new image, or resume a run that pushed this commit's image
        id: image
        run: |
          ref="ghcr.io/mfroembgen/cookout:$VERSION"
          if docker buildx imagetools inspect --raw "$ref" > /tmp/manifest.json 2> /tmp/manifest-error; then
            docker buildx imagetools inspect "$ref" --format '{{json .Image}}' > /tmp/image.json
            for platform in linux/amd64 linux/arm64; do
              revision="$(jq -r --arg p "$platform" '.[$p].config.Labels["org.opencontainers.image.revision"] // "none"' /tmp/image.json)"
              test "$revision" = "$GITHUB_SHA" || { echo "$ref $platform was built from $revision, not $GITHUB_SHA" >&2; exit 1; }
            done
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "index=sha256:$(sha256sum < /tmp/manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -Eq "$ref: not found|manifest unknown|name unknown" /tmp/manifest-error || { cat /tmp/manifest-error >&2; exit 1; }
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    if: needs.gate.outputs.publish == 'true'
    needs: [verify, gate]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build this platform's image natively and push it by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/mfroembgen/cookout,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/mfroembgen/cookout
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Keep the digest for the merge
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected digest $DIGEST" >&2; exit 1; }
          mkdir -p /tmp/digests
          printf '%s' "$DIGEST" > "/tmp/digests/${PLATFORM//\//-}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: ${{ !cancelled() && needs.gate.result == 'success' && ((needs.gate.outputs.publish == 'true' && needs.build.result == 'success') || (needs.gate.outputs.publish == 'false' && needs.build.result == 'skipped')) }}
    needs: [verify, gate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.gate.outputs.publish == 'true'
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the release and the version tag again before writing
        id: recheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ needs.gate.outputs.publish }}
          GATE_INDEX: ${{ needs.gate.outputs.index }}
        run: |
          tag="@ai-hero/cookout@$VERSION"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > /tmp/release-tags
          if grep -Fxq "$tag" /tmp/release-tags; then
            echo "Release $tag already exists; inspect its provenance before retrying" >&2
            exit 1
          fi
          ref="ghcr.io/mfroembgen/cookout:$VERSION"
          if docker buildx imagetools inspect --raw "$ref" > /tmp/manifest.json 2> /tmp/manifest-error; then
            index="sha256:$(sha256sum < /tmp/manifest.json | cut -d' ' -f1)"
            if [ "$PUBLISH" = false ]; then
              test "$index" = "$GATE_INDEX" || { echo "$ref moved from $GATE_INDEX to $index after the gate" >&2; exit 1; }
            fi
            docker buildx imagetools inspect "$ref" --format '{{json .Image}}' > /tmp/image.json
            for platform in linux/amd64 linux/arm64; do
              revision="$(jq -r --arg p "$platform" '.[$p].config.Labels["org.opencontainers.image.revision"] // "none"' /tmp/image.json)"
              test "$revision" = "$GITHUB_SHA" || { echo "$ref $platform was built from $revision, not $GITHUB_SHA" >&2; exit 1; }
            done
            echo "tag=false" >> "$GITHUB_OUTPUT"
          else
            grep -Eq "$ref: not found|manifest unknown|name unknown" /tmp/manifest-error || { cat /tmp/manifest-error >&2; exit 1; }
            test "$PUBLISH" = true || { echo "$ref disappeared after the gate" >&2; exit 1; }
            echo "tag=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check each platform's digest before tagging
        if: steps.recheck.outputs.tag == 'true'
        run: |
          for platform in linux/amd64 linux/arm64; do
            digest="$(cat "/tmp/digests/${platform//\//-}")"
            docker buildx imagetools inspect "ghcr.io/mfroembgen/cookout@$digest" --format '{{json .Image}}' > /tmp/one.json
            revision="$(jq -r --arg p "$platform" 'if has("config") then . else .[$p] end | .config.Labels["org.opencontainers.image.revision"] // "none"' /tmp/one.json)"
            os_arch="$(jq -r --arg p "$platform" 'if has("config") then . else .[$p] end | "\(.os)/\(.architecture)"' /tmp/one.json)"
            test "$os_arch" = "$platform" || { echo "$digest is $os_arch, not $platform" >&2; exit 1; }
            test "$revision" = "$GITHUB_SHA" || { echo "$digest was built from $revision, not $GITHUB_SHA" >&2; exit 1; }
          done
      - name: Tag both platforms as one multi-platform image
        if: steps.recheck.outputs.tag == 'true'
        run: |
          ref="ghcr.io/mfroembgen/cookout:$VERSION"
          docker buildx imagetools create -t "$ref" \
            "ghcr.io/mfroembgen/cookout@$(cat /tmp/digests/linux-amd64)" \
            "ghcr.io/mfroembgen/cookout@$(cat /tmp/digests/linux-arm64)"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
        run: |
          printf '%s\n' \
            "cookout $VERSION with the fork's patches: an image built from upstream's Dockerfile." \
            "" \
            "Upstream release commit: $RELEASE_SHA (npm @ai-hero/cookout@$VERSION)" \
            "Patched source commit: $GITHUB_SHA" \
            "Image: ghcr.io/mfroembgen/cookout:$VERSION" \
            "" \
            "The Git tag points to the original upstream commit. The image uses the patched source commit recorded above." \
            > /tmp/release-notes.md
          gh release create "@ai-hero/cookout@$VERSION" --verify-tag --draft \
            --title "cookout $VERSION (fork)" --notes-file /tmp/release-notes.md
